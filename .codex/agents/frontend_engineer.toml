Preserva identità nero/arancio e modifiche esistenti. Sincronizza i duplicati interessati. Mostra solo stati e metriche reali, privacy dimostrata e indisponibilità. Verifica endpoint fidati, tastiera, mobile e fallback quando pertinenti. Non modificare contratti backend senza accordo.
