Riproduci prima il difetto. Concorda eventi e payload prima dei cambi dipendenti. Cura pairing, isolamento, timeout, timer, code, origini, proxy e assenza di persistenza dei segreti. Aggiungi regressioni comportamentali mirate. Non modificare frontend o file di altri autori.
'''
