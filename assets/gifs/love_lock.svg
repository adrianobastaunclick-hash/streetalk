<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_lovelock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_lovelock" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes lockPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px #eab308); }
        50% { transform: scale(1.14); filter: drop-shadow(0 0 35px #facc15); }
      }
      @keyframes shackleRing {
        0% { r: 42; opacity: 0.8; stroke-width: 2; }
        100% { r: 90; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes beamRotate {
        0% { transform: rotate(0deg); opacity: 0.3; }
        50% { transform: rotate(180deg); opacity: 0.8; }
        100% { transform: rotate(360deg); opacity: 0.3; }
      }
      .lock-icon { animation: lockPulse 1.5s ease-in-out infinite; transform-origin: center; font-size: 72px; }
      .shackle-pulse { animation: shackleRing 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .lock-beam { animation: beamRotate 6s linear infinite; transform-origin: 160px 110px; }
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #eab308; letter-spacing: 1px; }
      .border-glow { stroke: #eab308; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_lovelock)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_lovelock)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#eab308" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">AMORE</text>

  <!-- Central Animated Icon & Effects -->
  <circle class="shackle-pulse" cx="160" cy="110" r="42" fill="none" stroke="#eab308" stroke-width="2"/>
  <g class="lock-beam">
    <line x1="160" y1="52" x2="160" y2="168" stroke="#facc15" stroke-width="1" stroke-dasharray="8, 6"/>
    <line x1="102" y1="110" x2="218" y2="110" stroke="#facc15" stroke-width="1" stroke-dasharray="8, 6"/>
  </g>
  <text x="160" y="130" text-anchor="middle" class="lock-icon">🔐</text>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">STREET LOCK</text>
</svg>
