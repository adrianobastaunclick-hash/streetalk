<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_cyber" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <style>
      
      @keyframes glitchRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes glitchFlash { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.15); filter: drop-shadow(0 0 25px #00f2fe); } }
      .cyber-bolt { animation: glitchFlash 0.9s ease-in-out infinite; transform-origin: center; font-size: 72px; }
      .hud-reticle { animation: glitchRotate 6s linear infinite; transform-origin: 160px 110px; }
    
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #00f2fe; letter-spacing: 1px; }
      .border-glow { stroke: #00f2fe; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_cyber)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_cyber)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">CYBERPUNK</text>

  <!-- Central Animated Icon & Effects -->
  
      <circle class="hud-reticle" cx="160" cy="110" r="60" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="20, 10, 5, 10"/>
      <line x1="160" y1="40" x2="160" y2="60" stroke="#00f2fe" stroke-width="2"/>
      <line x1="160" y1="160" x2="160" y2="180" stroke="#00f2fe" stroke-width="2"/>
    
  <text x="160" y="130" text-anchor="middle" class="cyber-bolt">⚡</text>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">CYBER HUD</text>
</svg>