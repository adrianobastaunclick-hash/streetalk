<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_heartpulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_heartpulse" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes heartDoubleBeat {
        0% { transform: scale(1); filter: drop-shadow(0 0 14px #e11d48); }
        12% { transform: scale(1.22); filter: drop-shadow(0 0 32px #f43f5e); }
        24% { transform: scale(1.05); filter: drop-shadow(0 0 16px #e11d48); }
        38% { transform: scale(1.28); filter: drop-shadow(0 0 42px #ff2a85); }
        62%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px #e11d48); }
      }
      @keyframes ecgWave {
        0% { r: 40; opacity: 0.85; stroke-width: 2.5; }
        100% { r: 92; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes ecgLineMotion {
        0% { stroke-dashoffset: 120; opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { stroke-dashoffset: -120; opacity: 0.3; }
      }
      .heart-pulse-icon { animation: heartDoubleBeat 1.1s ease-in-out infinite; transform-origin: center; font-size: 74px; }
      .ecg-ring { animation: ecgWave 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .ecg-line { animation: ecgLineMotion 2.2s linear infinite; stroke-dasharray: 40, 20; }
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #e11d48; letter-spacing: 1px; }
      .border-glow { stroke: #e11d48; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_heartpulse)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_heartpulse)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#e11d48" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">AMORE</text>

  <!-- Central Animated Icon & Effects -->
  <circle class="ecg-ring" cx="160" cy="110" r="40" fill="none" stroke="#e11d48" stroke-width="2"/>
  <!-- ECG trace behind heart -->
  <path class="ecg-line" d="M100,110 L130,110 L138,95 L145,125 L152,105 L158,110 L220,110" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="160" y="130" text-anchor="middle" class="heart-pulse-icon">💖</text>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">BEATING HEART</text>
</svg>
