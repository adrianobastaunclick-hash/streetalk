<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_cupid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_cupid" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes arrowDart {
        0%, 100% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 15px #f59e0b); }
        50% { transform: scale(1.18) translate(4px, -4px); filter: drop-shadow(0 0 35px #fbbf24); }
      }
      @keyframes radarTarget {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes crosshairPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.9; }
      }
      .cupid-icon { animation: arrowDart 1.4s ease-in-out infinite; transform-origin: center; font-size: 72px; }
      .radar-reticle { animation: radarTarget 8s linear infinite; transform-origin: 160px 110px; }
      .crosshair-line { animation: crosshairPulse 1.4s ease-in-out infinite; }
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #f59e0b; letter-spacing: 1px; }
      .border-glow { stroke: #f59e0b; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_cupid)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_cupid)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">AMORE</text>

  <!-- Central Animated Icon & Effects -->
  <circle class="radar-reticle" cx="160" cy="110" r="58" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="16, 12, 4, 12"/>
  <line class="crosshair-line" x1="160" y1="46" x2="160" y2="60" stroke="#f59e0b" stroke-width="2"/>
  <line class="crosshair-line" x1="160" y1="160" x2="160" y2="174" stroke="#f59e0b" stroke-width="2"/>
  <line class="crosshair-line" x1="96" y1="110" x2="110" y2="110" stroke="#f59e0b" stroke-width="2"/>
  <line class="crosshair-line" x1="210" y1="110" x2="224" y2="110" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="130" text-anchor="middle" class="cupid-icon">💘</text>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">CUPID BOLT</text>
</svg>
