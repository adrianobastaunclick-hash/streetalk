<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_devil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_devil" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes devilBob {
        0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 0 16px #a855f7); }
        50% { transform: scale(1.15) translateY(-6px); filter: drop-shadow(0 0 35px #c084fc); }
      }
      @keyframes devilHalo {
        0% { transform: rotate(0deg); stroke-dashoffset: 0; }
        100% { transform: rotate(360deg); stroke-dashoffset: 40; }
      }
      @keyframes hornPulse {
        0%, 100% { opacity: 0.35; transform: scale(0.9); }
        50% { opacity: 0.95; transform: scale(1.2); filter: drop-shadow(0 0 10px #c084fc); }
      }
      .devil-icon { animation: devilBob 1.4s ease-in-out infinite; transform-origin: center; font-size: 72px; }
      .devil-halo { animation: devilHalo 5s linear infinite; transform-origin: 160px 110px; }
      .horn-flare-left { animation: hornPulse 1.4s ease-in-out infinite; transform-origin: 138px 78px; }
      .horn-flare-right { animation: hornPulse 1.4s ease-in-out infinite 0.2s; transform-origin: 182px 78px; }
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #a855f7; letter-spacing: 1px; }
      .border-glow { stroke: #a855f7; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_devil)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_devil)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">FLIRT</text>

  <!-- Central Animated Icon & Effects -->
  <circle class="devil-halo" cx="160" cy="110" r="56" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="12, 8"/>
  <circle class="horn-flare-left" cx="138" cy="78" r="6" fill="#c084fc" opacity="0.6"/>
  <circle class="horn-flare-right" cx="182" cy="78" r="6" fill="#c084fc" opacity="0.6"/>
  <text x="160" y="130" text-anchor="middle" class="devil-icon">😈</text>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">SWEET DEVIL</text>
</svg>
