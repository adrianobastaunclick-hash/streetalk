<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_hearts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_hearts" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes twinOrbit {
        0%, 100% { transform: scale(1) translateY(0) rotate(-4deg); filter: drop-shadow(0 0 15px #ff4d6d); }
        50% { transform: scale(1.16) translateY(-6px) rotate(4deg); filter: drop-shadow(0 0 34px #ff758f); }
      }
      @keyframes orbitEllipse {
        0% { transform: rotate(0deg); stroke-dashoffset: 0; }
        100% { transform: rotate(360deg); stroke-dashoffset: 50; }
      }
      @keyframes sparkleSwirl {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 8px #ff758f); }
      }
      .twin-hearts-icon { animation: twinOrbit 1.5s ease-in-out infinite; transform-origin: center; font-size: 72px; }
      .orbit-path { animation: orbitEllipse 6s linear infinite; transform-origin: 160px 110px; }
      .swirl-spark { animation: sparkleSwirl 1.4s ease-in-out infinite; }
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #ff4d6d; letter-spacing: 1px; }
      .border-glow { stroke: #ff4d6d; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_hearts)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_hearts)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#ff4d6d" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">AMORE</text>

  <!-- Central Animated Icon & Effects -->
  <ellipse class="orbit-path" cx="160" cy="110" rx="64" ry="46" fill="none" stroke="#ff4d6d" stroke-width="1.5" stroke-dasharray="10, 8"/>
  <circle class="swirl-spark" cx="106" cy="85" r="3" fill="#ff758f"/>
  <circle class="swirl-spark" cx="218" cy="132" r="3" fill="#ff4d6d"/>
  <text x="160" y="130" text-anchor="middle" class="twin-hearts-icon">💕</text>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">TWIN HEARTS</text>
</svg>
