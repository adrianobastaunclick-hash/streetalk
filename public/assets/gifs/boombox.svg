<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_boombox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_boombox" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ff652f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff652f" stop-opacity="0"/>
    </radialGradient>
    <style>
      
      @keyframes bassPump { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); filter: drop-shadow(0 0 20px #ff652f); } }
      @keyframes eqBar { 0%, 100% { height: 12px; } 50% { height: 36px; } }
      .boom-icon { animation: bassPump 0.6s cubic-bezier(0.4, 0, 0.6, 1) infinite; transform-origin: center; font-size: 70px; }
      .eq1 { animation: eqBar 0.5s ease-in-out infinite; }
      .eq2 { animation: eqBar 0.7s ease-in-out infinite 0.15s; }
      .eq3 { animation: eqBar 0.4s ease-in-out infinite 0.3s; }
    
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #ff652f; letter-spacing: 1px; }
      .border-glow { stroke: #ff652f; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_boombox)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_boombox)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#ff652f" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">STREET</text>

  <!-- Central Animated Icon & Effects -->
  
      <rect class="eq1" x="70" y="80" width="6" height="24" rx="3" fill="#ff652f"/>
      <rect class="eq2" x="80" y="70" width="6" height="34" rx="3" fill="#ff652f"/>
      <rect class="eq3" x="240" y="75" width="6" height="29" rx="3" fill="#ff652f"/>
      <rect class="eq2" x="250" y="80" width="6" height="24" rx="3" fill="#ff652f"/>
    
  <text x="160" y="130" text-anchor="middle" class="boom-icon">📻</text>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">BOOMBOX BASS</text>
</svg>