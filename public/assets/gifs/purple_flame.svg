<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_purpleflame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_purpleflame" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes plasmaWave {
        0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 0 16px #9333ea); }
        50% { transform: scale(1.18) translateY(-6px); filter: drop-shadow(0 0 38px #c084fc); }
      }
      @keyframes combustionRings {
        0% { r: 38; opacity: 0.9; stroke-width: 2.5; }
        100% { r: 92; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes plasmaCorona {
        0% { transform: rotate(0deg); stroke-dashoffset: 0; }
        100% { transform: rotate(360deg); stroke-dashoffset: 48; }
      }
      .purple-flame-icon { animation: plasmaWave 1.3s ease-in-out infinite; transform-origin: center; font-size: 72px; }
      .combustion-ring { animation: combustionRings 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .plasma-corona { animation: plasmaCorona 5s linear infinite; transform-origin: 160px 110px; }
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #9333ea; letter-spacing: 1px; }
      .border-glow { stroke: #9333ea; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_purpleflame)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_purpleflame)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#9333ea" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">SPICY</text>

  <!-- Central Animated Icon & Effects -->
  <circle class="combustion-ring" cx="160" cy="110" r="38" fill="none" stroke="#9333ea" stroke-width="2"/>
  <circle class="plasma-corona" cx="160" cy="110" r="54" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="14, 10"/>
  <text x="160" y="130" text-anchor="middle" class="purple-flame-icon">💜</text>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">VIOLET HEAT</text>
</svg>
