<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_chili" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_chili" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes chiliFlicker {
        0%, 100% { transform: scale(1) rotate(-5deg); filter: drop-shadow(0 0 16px #ef4444); }
        50% { transform: scale(1.18) rotate(5deg) translateY(-4px); filter: drop-shadow(0 0 36px #f87171); }
      }
      @keyframes flameTrailPulse {
        0% { r: 40; opacity: 0.85; stroke-width: 2.5; }
        100% { r: 92; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes heatDistort {
        0%, 100% { opacity: 0.25; transform: translateY(0); }
        50% { opacity: 0.8; transform: translateY(-6px); }
      }
      .chili-icon { animation: chiliFlicker 1.3s ease-in-out infinite; transform-origin: center; font-size: 72px; }
      .flame-trail { animation: flameTrailPulse 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .heat-wave { animation: heatDistort 1.6s ease-in-out infinite; }
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #ef4444; letter-spacing: 1px; }
      .border-glow { stroke: #ef4444; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_chili)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_chili)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">SPICY</text>

  <!-- Central Animated Icon & Effects -->
  <circle class="flame-trail" cx="160" cy="110" r="40" fill="none" stroke="#ef4444" stroke-width="2"/>
  <!-- Heat wave lines -->
  <g class="heat-wave">
    <path d="M125,75 Q130,65 125,55" fill="none" stroke="#f87171" stroke-width="1.5" opacity="0.6"/>
    <path d="M160,70 Q165,60 160,50" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.7"/>
    <path d="M195,75 Q200,65 195,55" fill="none" stroke="#f87171" stroke-width="1.5" opacity="0.6"/>
  </g>
  <text x="160" y="130" text-anchor="middle" class="chili-icon">🌶️</text>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">RED CHILI</text>
</svg>
