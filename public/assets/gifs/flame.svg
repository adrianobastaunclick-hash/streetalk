<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_flame" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ff652f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff652f" stop-opacity="0"/>
    </radialGradient>
    <style>
      
      @keyframes flameWave { 0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 0 15px #ff652f); } 50% { transform: scale(1.15) translateY(-6px); filter: drop-shadow(0 0 30px #ff8c00); } }
      @keyframes pulseRing { 0% { r: 50; opacity: 0.8; } 100% { r: 90; opacity: 0; } }
      .flame-icon { animation: flameWave 1.2s ease-in-out infinite; transform-origin: center; font-size: 72px; }
      .ring { animation: pulseRing 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #ff652f; letter-spacing: 1px; }
      .border-glow { stroke: #ff652f; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_flame)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_flame)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#ff652f" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">TREND</text>

  <!-- Central Animated Icon & Effects -->
  <circle class="ring" cx="160" cy="110" r="50" fill="none" stroke="#ff652f" stroke-width="2"/>
  <text x="160" y="130" text-anchor="middle" class="flame-icon">🔥</text>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">LIT FIRE</text>
</svg>