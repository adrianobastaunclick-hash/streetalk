<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_popcorn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_popcorn" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <style>
      
      @keyframes popBounce { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-12px) rotate(-6deg); } 75% { transform: translateY(-6px) rotate(6deg); } }
      .pop-icon { animation: popBounce 0.9s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite; transform-origin: center; font-size: 72px; }
    
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #fbbf24; letter-spacing: 1px; }
      .border-glow { stroke: #fbbf24; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_popcorn)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_popcorn)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">TREND</text>

  <!-- Central Animated Icon & Effects -->
  
  <text x="160" y="130" text-anchor="middle" class="pop-icon">🍿</text>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">POPCORN DRAMA</text>
</svg>