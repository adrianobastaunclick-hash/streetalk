<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_wink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_wink" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes winkBob {
        0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 14px #f472b6); }
        45% { transform: scale(1.16) rotate(-4deg); filter: drop-shadow(0 0 30px #ec4899); }
        75% { transform: scale(1.06) rotate(3deg); }
      }
      @keyframes glintSpark {
        0%, 20%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
        45%, 65% { transform: scale(1.25) rotate(90deg); opacity: 1; filter: drop-shadow(0 0 10px #ffffff); }
      }
      @keyframes irisRing {
        0% { transform: rotate(0deg); opacity: 0.6; }
        50% { transform: rotate(180deg); opacity: 0.2; }
        100% { transform: rotate(360deg); opacity: 0.6; }
      }
      .wink-icon { animation: winkBob 1.6s ease-in-out infinite; transform-origin: center; font-size: 72px; }
      .sparkle-glint { animation: glintSpark 1.6s ease-in-out infinite; transform-origin: 178px 104px; }
      .iris-circle { animation: irisRing 4s linear infinite; transform-origin: 160px 110px; }
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #f472b6; letter-spacing: 1px; }
      .border-glow { stroke: #f472b6; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_wink)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_wink)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">FLIRT</text>

  <!-- Central Animated Icon & Effects -->
  <circle class="iris-circle" cx="160" cy="110" r="54" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="8, 6"/>
  <text x="160" y="130" text-anchor="middle" class="wink-icon">😉</text>
  <!-- Glint star overlay -->
  <g class="sparkle-glint">
    <path d="M178,92 L181,102 L191,104 L181,106 L178,116 L175,106 L165,104 L175,102 Z" fill="#ffffff"/>
  </g>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">WINK GLINT</text>
</svg>
