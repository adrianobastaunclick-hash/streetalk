<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_cherries" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_cherries" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#be123c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes cherrySwing {
        0%, 100% { transform: rotate(-5deg) scale(1); filter: drop-shadow(0 0 15px #be123c); }
        50% { transform: rotate(5deg) scale(1.15); filter: drop-shadow(0 0 34px #f43f5e); }
      }
      @keyframes glistenStar {
        0%, 25%, 100% { opacity: 0.2; transform: scale(0.6) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.2) rotate(90deg); filter: drop-shadow(0 0 10px #ffffff); }
      }
      @keyframes cherryPulseRing {
        0% { r: 38; opacity: 0.85; stroke-width: 2; }
        100% { r: 88; opacity: 0; stroke-width: 0.5; }
      }
      .cherry-icon { animation: cherrySwing 1.6s ease-in-out infinite; transform-origin: 160px 80px; font-size: 72px; }
      .cherry-ring { animation: cherryPulseRing 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .glisten-spark { animation: glistenStar 1.6s ease-in-out infinite; transform-origin: 146px 126px; }
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #be123c; letter-spacing: 1px; }
      .border-glow { stroke: #be123c; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_cherries)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_cherries)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#be123c" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">SPICY</text>

  <!-- Central Animated Icon & Effects -->
  <circle class="cherry-ring" cx="160" cy="110" r="38" fill="none" stroke="#be123c" stroke-width="2"/>
  <ellipse cx="160" cy="110" rx="58" ry="42" fill="none" stroke="#be123c" stroke-opacity="0.2" stroke-dasharray="6, 6"/>
  <text x="160" y="130" text-anchor="middle" class="cherry-icon">🍒</text>
  <!-- Glistening highlight star on cherry body -->
  <g class="glisten-spark">
    <path d="M146,120 L148,125 L153,126 L148,127 L146,132 L144,127 L139,126 L144,125 Z" fill="#ffffff"/>
  </g>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">SWEET DANGER</text>
</svg>
