<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_sparkle" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes sparkTwinkle {
        0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 15px #fbbf24); }
        50% { transform: scale(1.2) rotate(12deg); filter: drop-shadow(0 0 35px #fef08a); }
      }
      @keyframes orbitStars {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes shimmerPulse {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 8px #fef08a); }
      }
      .sparkle-icon { animation: sparkTwinkle 1.5s ease-in-out infinite; transform-origin: center; font-size: 72px; }
      .orbit-group { animation: orbitStars 6s linear infinite; transform-origin: 160px 110px; }
      .shimmer-point { animation: shimmerPulse 1.2s ease-in-out infinite; }
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #fbbf24; letter-spacing: 1px; }
      .border-glow { stroke: #fbbf24; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_sparkle)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_sparkle)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">FLIRT</text>

  <!-- Central Animated Icon & Effects -->
  <circle cx="160" cy="110" r="52" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-dasharray="4, 4"/>
  <g class="orbit-group">
    <path class="shimmer-point" d="M160,54 L162,59 L167,61 L162,63 L160,68 L158,63 L153,61 L158,59 Z" fill="#fbbf24"/>
    <path class="shimmer-point" d="M216,110 L218,115 L223,117 L218,119 L216,124 L214,119 L209,117 L214,115 Z" fill="#fef08a"/>
    <path class="shimmer-point" d="M160,166 L162,171 L167,173 L162,175 L160,180 L158,175 L153,173 L158,171 Z" fill="#fbbf24"/>
    <path class="shimmer-point" d="M104,110 L106,115 L111,117 L106,119 L104,124 L102,119 L97,117 L102,115 Z" fill="#fef08a"/>
  </g>
  <text x="160" y="130" text-anchor="middle" class="sparkle-icon">✨</text>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">FLIRT SPARKLE</text>
</svg>
