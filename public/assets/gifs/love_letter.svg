<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_loveletter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_loveletter" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes letterFloat {
        0%, 100% { transform: translateY(0) scale(1) rotate(-3deg); filter: drop-shadow(0 0 14px #fb7185); }
        50% { transform: translateY(-7px) scale(1.12) rotate(3deg); filter: drop-shadow(0 0 32px #fda4af); }
      }
      @keyframes sealPulse {
        0% { r: 36; opacity: 0.8; stroke-width: 2; }
        100% { r: 86; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes wingFlap {
        0%, 100% { transform: scaleX(1); opacity: 0.5; }
        50% { transform: scaleX(1.15); opacity: 0.9; }
      }
      .letter-icon { animation: letterFloat 1.6s ease-in-out infinite; transform-origin: center; font-size: 72px; }
      .seal-ring { animation: sealPulse 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .letter-aura { animation: wingFlap 2s ease-in-out infinite; transform-origin: 160px 110px; }
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #fb7185; letter-spacing: 1px; }
      .border-glow { stroke: #fb7185; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_loveletter)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_loveletter)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#fb7185" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">AMORE</text>

  <!-- Central Animated Icon & Effects -->
  <circle class="seal-ring" cx="160" cy="110" r="36" fill="none" stroke="#fb7185" stroke-width="2"/>
  <rect class="letter-aura" x="108" y="75" width="104" height="70" rx="8" fill="none" stroke="#fb7185" stroke-opacity="0.2" stroke-dasharray="6, 6"/>
  <text x="160" y="130" text-anchor="middle" class="letter-icon">💌</text>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">SECRET NOTE</text>
</svg>
