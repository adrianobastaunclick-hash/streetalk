<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bgGrad_kiss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#08090e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
    <radialGradient id="glow_kiss" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes kissPucker {
        0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 0 15px #ff2a85); }
        50% { transform: scale(1.18) translateY(-4px); filter: drop-shadow(0 0 35px #ff007f); }
      }
      @keyframes pulseRingKiss {
        0% { r: 42; opacity: 0.8; stroke-width: 2; }
        100% { r: 92; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes floatSparkKiss {
        0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.4; }
        50% { transform: translateY(-8px) scale(1.15); opacity: 0.95; }
      }
      .kiss-icon { animation: kissPucker 1.3s ease-in-out infinite; transform-origin: center; font-size: 72px; }
      .ring-kiss { animation: pulseRingKiss 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .spark-1 { animation: floatSparkKiss 2s ease-in-out infinite; transform-origin: 115px 85px; }
      .spark-2 { animation: floatSparkKiss 2.4s ease-in-out infinite 0.6s; transform-origin: 205px 75px; }
      .title-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; text-anchor: middle; }
      .badge-text { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 8px; font-weight: 700; fill: #ff2a85; letter-spacing: 1px; }
      .border-glow { stroke: #ff2a85; stroke-opacity: 0.35; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="240" rx="16" fill="url(#bgGrad_kiss)"/>
  <rect width="320" height="240" rx="16" fill="url(#glow_kiss)"/>
  <rect x="1" y="1" width="318" height="238" rx="15" fill="none" class="border-glow"/>

  <!-- Top Category Chip -->
  <rect x="14" y="12" width="70" height="18" rx="6" fill="#141724" stroke="#ff2a85" stroke-opacity="0.4" stroke-width="1"/>
  <text x="22" y="24" class="badge-text">FLIRT</text>

  <!-- Central Animated Icon & Effects -->
  <circle class="ring-kiss" cx="160" cy="110" r="42" fill="none" stroke="#ff2a85" stroke-width="2"/>
  <path class="spark-1" d="M115,80 L117,84 L121,85 L117,86 L115,90 L113,86 L109,85 L113,84 Z" fill="#ff2a85"/>
  <path class="spark-2" d="M205,70 L207,74 L211,75 L207,76 L205,80 L203,76 L199,75 L203,74 Z" fill="#ff70a6"/>
  <text x="160" y="130" text-anchor="middle" class="kiss-icon">💋</text>

  <!-- Bottom Title Banner -->
  <rect x="14" y="196" width="292" height="30" rx="8" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="160" y="215" class="title-text">NEON KISS</text>
</svg>
